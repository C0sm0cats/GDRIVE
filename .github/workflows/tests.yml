name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum the README promises, and the latest.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build .venv with the runner
        run: sh ./run-savegdrive.sh --help
      - name: Run the tests (the README command)
        run: .venv/bin/python -m unittest discover -s tests
